<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TestDaF Übung – Text &amp; Fragen</title>
<style>
  :root{
    --primary:#0e6e8c;
    --accent:#c8102e;
    --bg-box:#dde3e8;
    --border:#0e6e8c;
  }
  *{box-sizing:border-box; font-family: Arial, Helvetica, sans-serif;}
  body{margin:0; padding:20px; background:#f4f6f7; color:#222;}
  .header{background:var(--primary); color:#fff; padding:14px 20px; font-size:22px; font-weight:bold; border-radius:4px 4px 0 0;}
  .instructions{background:#eaf1f4; padding:16px 20px; font-size:15px; line-height:1.5;}
  .timer{display:inline-block; border:2px solid var(--primary); border-radius:50%; width:70px; height:70px; text-align:center; line-height:70px; font-weight:bold; color:var(--primary); margin-top:10px;}
  .toolbar{display:flex; justify-content:flex-end; gap:8px; padding:10px 20px 0 20px; background:#fff;}
  .toolbtn{width:38px; height:38px; border:1px solid var(--primary); background:#fff; color:var(--primary); border-radius:4px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .toolbtn.small{font-size:12px;}
  .toolbtn.big{font-size:16px;}
  .toolbtn.active{background:var(--primary); color:#fff;}
  .main{display:flex; gap:16px; padding:10px 20px 20px 20px; background:#fff;}
  .textpanel{flex:1; max-height:600px; overflow-y:auto; padding-right:10px; border-right:1px solid #ccc; font: size 15px; line-height:1.6;}
  .textpanel h3{color:var(--primary);}
  .textpanel p{margin-bottom:16px;}
  .textpanel .pnum{font-weight:bold; color:var(--primary);}
  .textpanel mark.hl{background:#fdea63; cursor:pointer; border-radius:2px;}
  .textpanel.marking{cursor:text;}
  .qpanel{flex:1.2;}
  .qrow{background:var(--bg-box); border:1px solid #aab; border-radius:4px; margin-bottom:10px; overflow:hidden;}
  .qhead{padding:10px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-size: 15px;}
  .qhead b{color:var(--primary); margin-right:6px;}
  .qhead.answered{background:#eef3f5;}
  .qbody{display:none; padding:8px 14px 14px 14px; background:#fff;}
  .qbody.open{display:block;}
  .option{display:block; width:100%; text-align:left; padding:8px 10px; margin:4px 0; border:1px solid #bbb; border-radius:4px; background:#fdfdfd; cursor:pointer; user-select:text; font-size:15px;}
  .option.selected{border-color:var(--primary); background:#dceaf0;}
  .option.correct{border-color:green; background:#e3f7e3;}
  .option.wrong{border-color:var(--accent); background:#fbe4e7;}
  .option,
.option * {
    font-size: 15px !important;
}

.option{
    display:block;
    width:100%;
    text-align:left;
    padding:8px 10px;
    margin:4px 0;
    border:1px solid #bbb;
    border-radius:4px;
    background:#fdfdfd;
    cursor:pointer;
    user-select:text;
    font-size:15px;
}
  .footer{display:flex; justify-content:flex-end; gap:10px; padding:16px 20px;}
  button{background:var(--accent); color:#fff;; border:none; padding:10px 20px; border-radius:4px; font-size:15px; cursor:pointer;}
  button.secondary{background:#888;}
  #result{padding:0 20px 20px; font-weight:bold;}
  </style>
</head>
<body>

<div class="header">LESEN – Aufgabentyp 3: Text &amp; Fragen</div>

<div class="instructions">
  Lesen Sie den Text.<br>
  <strong>Beantworten Sie die Fragen 1–7.</strong><br>
  Klicken Sie die Fragen an und entscheiden Sie, welche Lösung passt.<br>
  Für jede Frage gibt es genau eine richtige Lösung.
  <div class="timer" id="timer">15:10</div>
</div>

<div class="toolbar">
  <button class="toolbtn small" onclick="changeFontSize(-1)" title="Verkleinern">A-</button>
  <button class="toolbtn big" onclick="changeFontSize(1)" title="Vergrößern">A+</button>
  <button class="toolbtn" id="markBtn" onclick="toggleMarking()" title="Markieren">✎</button>
</div>

<div class="main">
  <div class="textpanel" id="textpanel"></div>
  <div class="qpanel" id="qpanel"></div>
</div>

<div id="result"></div>

<div class="footer">

  <button class="action secondary" onclick="resetExercise()">
    Zurücksetzen
  </button>

  <button class="action" onclick="checkAnswers()">
    Prüfen
  </button>

  <button class="action" onclick="saveAT3AndGoToNext()">Weiter</button>
</button>

</div>

<script>
/* ============================================================
   HIER ANPASSEN: Neue Übung = Titel, Absätze und Fragen ersetzen.
   correct = Index (0=a, 1=b, 2=c, 3=d)
   ============================================================ */
const textTitle = "Epigenetik – Die molekulare Brücke zwischen Umwelt und Genom";

const paragraphs = [

"Über Jahrzehnte hinweg dominierte in der Evolutionsbiologie das Dogma des genetischen Determinismus. Demnach galt die Sequenz der Desoxyribonukleinsäure (DNA) als der unveränderliche Bauplan eines Organismus, dessen Modifikationen ausschließlich auf zufälligen Mutationen über Generationen hinweg beruhen. Phänotypische Variationen, die durch kurzfristige Umwelteinflüsse erworben wurden, galten nach klassischer Auffassung als nicht erblich. Diese reduktionistische Sichtweise wurde jedoch durch die Etablierung der Epigenetik grundlegend erschüttert. Dieses Forschungsfeld untersucht zelluläre Mechanismen, die die Aktivität von Genen regulieren, ohne dabei die zugrunde liegende Nukleotidsequenz selbst zu alterieren, wodurch eine dynamische Interaktion zwischen Genom und Umwelt postuliert wird.",

"Im Fokus der epigenetischen Forschung stehen biochemische Modifikationen des Chromatins, allen voran die DNA-Methylierung sowie die Acetylierung von Histonproteinen. Bei der DNA-Methylierung werden Methylgruppen an spezifische Cytosin-Basen gekoppelt, was in der Regel zu einer dauerhaften Blockade der Transkription führt – das betroffene Gen wird quasi stummgeschaltet. Die Histon-Modifikation hingegen verändert die Verpackungsdichte der DNA um die Kernproteine: Eine Acetylierung lockert die Struktur auf, sodass die genutzte Erbinformation für RNA-Polymerasen zugänglich wird. Diese hochkomplexen Prozesse fungieren somit als molekulare Schalter, die bestimmen, welche genetischen Potenziale einer Zelle in Reaktion auf exogene Stimuli tatsächlich abgerufen werden.",

"Was die Epigenetik für die moderne Medizin und Evolutionstheorie gleichermaßen revolutionär macht, ist der Nachweis der transgenerationalen Stabilität dieser Modifikationen. Entgegen der früheren Annahme, dass bei der Bildung von Keimzellen sämtliche epigenetischen Markierungen vollständig gelöscht werden, zeigen jüngere Studien, dass bestimmte umweltinduzierte molekulare Signaturen diese Reprogrammierung überstehen. Traumata, Mangelernährung oder chronischer Stress hinterlassen somit nicht nur im Nervensystem der Betroffenen biologische Spuren, sondern können über epigenetische Kanäle auch die Genregulation der nachfolgenden Generationen nachweislich beeinflussen, ohne dass eine Mutation stattgefunden hätte.",

"Ein zentrales Modell zur Untersuchung dieser Phänomene stellt die Zelldifferenzierung während der Embryogenese dar. Obwohl jede somatische Zelle eines Organismus über eine identische genetische Ausstattung verfügt, entwickelt sie sich je nach Gewebetyp zu einer spezialisierten Entität mit völlig unterschiedlichen Funktionen. Diese Divergenz wird ausschließlich durch zeitlich und räumlich präzise koordinierte epigenetische Muster gesteuert, die das Expressionsprofil der Zelle determinieren. Fehler in dieser fein austarierten molekularen Choreografie führen unweigerlich zu schweren Entwicklungsstörungen oder der malignen Transformation von Geweben, was die fundamentale Bedeutung der Epigenetik für die Homöostase des Organismus unterstreicht.",

"Trotz des rasanten Erkenntnisgewinns steht die klinische Anwendung epigenetischer Therapien vor immensen Hürden. Zwar wurden bereits erste Medikamente entwickelt, die als sogenannte Methyltransferase-Inhibitoren die Stummschaltung von Tumorsuppressorgenen in Krebszellen rückgängig machen sollen, doch fehlt diesen Substanzen bislang eine präzise zelluläre Spezifität. Da die Wirkstoffe das gesamte Genom unspezifisch beeinflussen, besteht das gravierende Risiko, unbeabsichtigt gesunde Gene zu deregulieren oder oncogene Sequenzen zu aktivieren. Die Entwicklung zielgerichteter Epitherapeutika, die ausschließlich an pathologisch veränderten Loci ansetzen, bleibt eine der größten Herausforderungen der biomedizinischen Grundlagenforschung.",

"Die philosophischen Implikationen dieser Entdeckungen erzwingen eine Revision unseres Verständnisses von biologischer Vorbestimmung. Die Epigenetik befreit den Menschen aus der Ohnmacht einer vermeintlich unabänderlichen genetischen Prägung und weist dem individuellen Lebensstil sowie gesellschaftlichen Umweltbedingungen eine genuine biologische Mitverantwortung zu. Nahrung, Stress und soziale Interaktionen sind keine epiphänomenalen Randbedingungen, sondern greifen direkt modulierend in die molekulare Steuerung unserer Zellen ein. Das Individuum erweist sich somit nicht als passives Produkt seiner Gene, sondern als aktiver Mitgestalter seiner molekularen Realität.",

];

const questions = [

  { stem: "Die Epigenetik widerlegt laut Absatz 1 die klassische Annahme, dass ...",
    options: [
      "Mutationen nutzlos sind.",
      "DNA-Sequenzen sich permanent verändern.",
      "erworbene Eigenschaften nicht vererbt werden.",
      "Umwelteinflüsse den Phänotyp prägen."
    ],
    correct: 2 },

  { stem: "Die in Absatz 2 beschriebenen Prozesse zeigen, dass ...",
    options: [
      "Genexpression blockiert wird.",
      "Modifikationen den Gen-Zugriff steuern.",
      "Stimuli die RNA verändern.",
      "die DNA-Struktur starr bleibt."
    ],
    correct: 1 },

  { stem: "Die transgenerationale Epigenetik (Absatz 3) basiert darauf, dass ...",
    options: [
      "Stress Mutationen erzwingt.",
      "Löschprozesse unvollständig sind.",
      "Traumata Gene zerstören.",
      "Keimzellen keine Marker besitzen."
    ],
    correct: 1 },

  { stem: "Die Zelldifferenzierung in Absatz 4 verdeutlicht, dass ...",
    options: [
      "identische Gene verschiedene Profile bilden.",
      "Gensequenzen embryonal repariert werden.",
      "Gewebe ihre Gen-Ausstattung anpassen.",
      "Gewebetransformationen immer malign verlaufen."
    ],
    correct: 0 },

  { stem: "Die epigenetische Krebstherapie ist laut Absatz 5 schwierig, weil Wirkstoffe ...",
    options: [
      "Tumorsuppressorgene zerstören.",
      "das gesamte Genom unspezifisch verändern.",
      "von Krebszellen blockiert werden.",
      "Loci absichtlich ignorieren."
    ],
    correct: 1 },

  { stem: "Welche Überschrift passt zu Absatz 6?",
    options: [
      "Die biologische Ohnmacht des Menschen",
      "Stabilität sozialer Interaktionen",
      "Das Genom als historisches Produkt",
      "Der Lebensstil als zellulärer Modulator"
    ],
    correct: 3 },

  { stem: "Das Hauptanliegen des Textes ist es, ...",
    options: [
      "den genetischen Determinismus zu stärken.",
      "über die Mechanismen der Genregulation zu informieren.",
      "vor Risiken neuer Krebstherapien zu warnen.",
      "Vererbungstheorien philosophisch zu widerlegen."
    ],
    correct: 1 }

];

let userAnswers = new Array(questions.length).fill(null);
let timeLeft = 910;
let timerInterval;
let fontSize = 15;
let markingOn = false;
const letters = ['a','b','c','d'];


function changeFontSize(delta){
  fontSize = Math.min(22, Math.max(11, fontSize + delta));

  document.getElementById('textpanel').style.fontSize = fontSize + 'px';
}

function toggleMarking(){
  markingOn = !markingOn;
  const btn = document.getElementById('markBtn');
  const tp = document.getElementById('textpanel');
  btn.classList.toggle('active', markingOn);
  tp.classList.toggle('marking', markingOn);
}

function handleTextpanelMouseUp(){
  if(!markingOn) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const tp = document.getElementById('textpanel');
  const allowed =
  document.getElementById('textpanel').contains(range.commonAncestorContainer) ||
  document.getElementById('qpanel').contains(range.commonAncestorContainer);

if(!allowed) return;
  if(range.toString().trim() === '') { sel.removeAllRanges(); return; }
  try{
    const mark = document.createElement('mark');
    mark.className = 'hl';
    range.surroundContents(mark);
  }catch(e){
    // selection crosses element boundaries; skip silently
  }
  sel.removeAllRanges();
}


function handleTextpanelClick(e){
  const mark = e.target.closest('mark.hl');
  if(mark){
    const parent = mark.parentNode;
    while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    parent.normalize();
  }
}

function buildExercise(){
  const tp = document.getElementById('textpanel');
  tp.innerHTML = `<h3>${textTitle}</h3>` +
  paragraphs.map((p,i)=>
    `<p class="paragraph-${i}">
      <span class="pnum">(${i+1})</span> ${p}
    </p>`
  ).join('');
  fontSize = 15;
  tp.style.fontSize = fontSize + 'px';
  markingOn = false;
  document.getElementById('markBtn').classList.remove('active');
  tp.classList.remove('marking');
  tp.onmouseup = handleTextpanelMouseUp;
  document.getElementById('qpanel').onmouseup = handleTextpanelMouseUp;
  tp.onclick = handleTextpanelClick;
  
  const qp = document.getElementById('qpanel');
  qp.innerHTML = '';
  userAnswers = new Array(questions.length).fill(null);

  questions.forEach((q, qi)=>{
    const row = document.createElement('div');
    row.className = 'qrow';

    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = `<span><b>Frage ${qi+1}:</b> ${q.stem}</span><span>▾</span>`;
    head.onclick = ()=> toggleBody(qi);

    const body = document.createElement('div');
    body.className = 'qbody';
    body.id = 'qbody-'+qi;

    q.options.forEach((opt, oi)=>{
  const b = document.createElement('div');

  b.className = 'option';

  b.innerHTML =
    `<span class="option-letter">${letters[oi]})</span> ${opt}`;

  b.onclick = ()=> selectOption(qi, oi);

  body.appendChild(b);
});

    row.appendChild(head);
    row.appendChild(body);
    qp.appendChild(row);
  });

  document.getElementById('result').textContent = '';
  startTimer();
}

function toggleBody(qi){

  // Alle anderen Fragen schließen
  document.querySelectorAll('.qbody').forEach((body, i) => {
    if(i !== qi){
      body.classList.remove('open');
    }
  });

  // Nur die angeklickte Frage öffnen
  const body = document.getElementById('qbody-' + qi);
  body.classList.toggle('open');

  // Zum passenden Absatz springen
  const paragraph = document.querySelector(
    '#textpanel .paragraph-' + qi
  );

  if(paragraph){
    paragraph.scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });

    // Absatz hervorheben
    document.querySelectorAll('#textpanel p').forEach(p => {
      p.classList.remove('focus-paragraph');
    });

    paragraph.classList.add('focus-paragraph');
  }
}

function selectOption(qi, oi){
  userAnswers[qi] = oi;
  const body = document.getElementById('qbody-'+qi);
  [...body.children].forEach((btn, i)=>{
    btn.classList.toggle('selected', i===oi);
  });
  const heads = document.querySelectorAll('.qhead');
  heads[qi].classList.add('answered');
}

function saveAT3AndGoToNext(){
  let score = 0;

  questions.forEach((q, qi)=>{
    if(userAnswers[qi] === q.correct){
      score++;
    }
  });

  localStorage.setItem("Lesen_AT3.5", score);

  window.location.href = "Lesen_AT4.5.html";
}

function checkAnswers(){
  clearInterval(timerInterval);
  let score = 0;
  questions.forEach((q, qi)=>{
    const body = document.getElementById('qbody-'+qi);
    [...body.children].forEach((btn, oi)=>{
      btn.classList.remove('selected');
      if(oi === q.correct) btn.classList.add('correct');
      else if(oi === userAnswers[qi]) btn.classList.add('wrong');
    });
    body.classList.add('open');
    if(userAnswers[qi] === q.correct) score++;
  });
  const resultEl = document.getElementById('result');

  resultEl.style.color = score === questions.length ? 'green' : 'var(--accent)';
  resultEl.textContent = `Ergebnis: ${score} von ${questions.length} richtig.`;
}

function resetExercise(){
  clearInterval(timerInterval);
  timeLeft = 910;
  buildExercise();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = 910;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){
      clearInterval(timerInterval);
      checkAnswers();
    }
  },1000);
}

function updateTimerDisplay(){
  const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
  const s = String(timeLeft%60).padStart(2,'0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

buildExercise();
</script>

</body>
</html>
