<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TestDaF Übung – Text &amp; Fragen</title>
<style>
  :root{
    --primary:#0e6e8c;
    --accent:#c8102e;
    --bg-box:#dde3e8;
    --border:#0e6e8c;
  }
  *{box-sizing:border-box; font-family: Arial, Helvetica, sans-serif;}
  body{margin:0; padding:20px; background:#f4f6f7; color:#222;}
  .header{background:var(--primary); color:#fff; padding:14px 20px; font-size:22px; font-weight:bold; border-radius:4px 4px 0 0;}
  .instructions{background:#eaf1f4; padding:16px 20px; font-size:15px; line-height:1.5;}
  .timer{display:inline-block; border:2px solid var(--primary); border-radius:50%; width:70px; height:70px; text-align:center; line-height:70px; font-weight:bold; color:var(--primary); margin-top:10px;}
  .toolbar{display:flex; justify-content:flex-end; gap:8px; padding:10px 20px 0 20px; background:#fff;}
  .toolbtn{width:38px; height:38px; border:1px solid var(--primary); background:#fff; color:var(--primary); border-radius:4px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .toolbtn.small{font-size:12px;}
  .toolbtn.big{font-size:16px;}
  .toolbtn.active{background:var(--primary); color:#fff;}
  .main{display:flex; gap:16px; padding:10px 20px 20px 20px; background:#fff;}
  .textpanel{flex:1; max-height:600px; overflow-y:auto; padding-right:10px; border-right:1px solid #ccc; font: size 15px; line-height:1.6;}
  .textpanel h3{color:var(--primary);}
  .textpanel p{margin-bottom:16px;}
  .textpanel .pnum{font-weight:bold; color:var(--primary);}
  .textpanel mark.hl{background:#fdea63; cursor:pointer; border-radius:2px;}
  .textpanel.marking{cursor:text;}
  .qpanel{flex:1.2;}
  .qrow{background:var(--bg-box); border:1px solid #aab; border-radius:4px; margin-bottom:10px; overflow:hidden;}
  .qhead{padding:10px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-size: 15px;}
  .qhead b{color:var(--primary); margin-right:6px;}
  .qhead.answered{background:#eef3f5;}
  .qbody{display:none; padding:8px 14px 14px 14px; background:#fff;}
  .qbody.open{display:block;}
  .option{display:block; width:100%; text-align:left; padding:8px 10px; margin:4px 0; border:1px solid #bbb; border-radius:4px; background:#fdfdfd; cursor:pointer; user-select:text; font-size:15px;}
  .option.selected{border-color:var(--primary); background:#dceaf0;}
  .option.correct{border-color:green; background:#e3f7e3;}
  .option.wrong{border-color:var(--accent); background:#fbe4e7;}
  .option,
.option * {
    font-size: 15px !important;
}

.option{
    display:block;
    width:100%;
    text-align:left;
    padding:8px 10px;
    margin:4px 0;
    border:1px solid #bbb;
    border-radius:4px;
    background:#fdfdfd;
    cursor:pointer;
    user-select:text;
    font-size:15px;
}
  .footer{display:flex; justify-content:flex-end; gap:10px; padding:16px 20px;}
  button{background:var(--accent); color:#fff;; border:none; padding:10px 20px; border-radius:4px; font-size:15px; cursor:pointer;}
  button.secondary{background:#888;}
  #result{padding:0 20px 20px; font-weight:bold;}
  </style>
</head>
<body>

<div class="header">LESEN – Aufgabentyp 3: Text &amp; Fragen</div>

<div class="instructions">
  Lesen Sie den Text.<br>
  <strong>Beantworten Sie die Fragen 1–7.</strong><br>
  Klicken Sie die Fragen an und entscheiden Sie, welche Lösung passt.<br>
  Für jede Frage gibt es genau eine richtige Lösung.
  <div class="timer" id="timer">15:10</div>
</div>

<div class="toolbar">
  <button class="toolbtn small" onclick="changeFontSize(-1)" title="Verkleinern">A-</button>
  <button class="toolbtn big" onclick="changeFontSize(1)" title="Vergrößern">A+</button>
  <button class="toolbtn" id="markBtn" onclick="toggleMarking()" title="Markieren">✎</button>
</div>

<div class="main">
  <div class="textpanel" id="textpanel"></div>
  <div class="qpanel" id="qpanel"></div>
</div>

<div id="result"></div>

<div class="footer">

  <button class="action secondary" onclick="resetExercise()">
    Zurücksetzen
  </button>

  <button class="action" onclick="checkAnswers()">
    Prüfen
  </button>

  <button class="action" onclick="saveAT3AndGoToNext()">Weiter</button>
</button>

</div>

<script>
/* ============================================================
   HIER ANPASSEN: Neue Übung = Titel, Absätze und Fragen ersetzen.
   correct = Index (0=a, 1=b, 2=c, 3=d)
   ============================================================ */
const textTitle = "Die stille Macht der Aufmerksamkeit";

const paragraphs = [

"Aufmerksamkeit gilt im Alltag oft als etwas Selbstverständliches. Menschen richten ihren Blick auf einen Text, hören einem Gespräch zu oder konzentrieren sich auf eine bestimmte Aufgabe, ohne bewusst darüber nachzudenken, was dabei im Gehirn geschieht. Tatsächlich ist die menschliche Aufmerksamkeit jedoch eine begrenzte Ressource. In jedem Augenblick erreichen uns wesentlich mehr Informationen, als wir gleichzeitig verarbeiten können. Das Gehirn muss deshalb fortwährend auswählen, welche Reize es bevorzugt berücksichtigt und welche weitgehend ausgeblendet werden. Diese Auswahl ermöglicht es überhaupt erst, komplexe Situationen zu bewältigen, kann aber zugleich dazu führen, dass wichtige Informationen unbemerkt bleiben.",

"Besonders deutlich wird diese Begrenzung bei Aufgaben, die eine hohe geistige Konzentration erfordern. Wer beispielsweise einen wissenschaftlichen Text liest, muss nicht nur einzelne Wörter erkennen, sondern Informationen miteinander verbinden, Zusammenhänge herstellen und bereits vorhandenes Wissen einbeziehen. Jede zusätzliche Ablenkung kann dabei die Verarbeitung erschweren. Untersuchungen zeigen allerdings, dass nicht jede Unterbrechung denselben Effekt hat. Entscheidend ist vielmehr, wie häufig zwischen verschiedenen Tätigkeiten gewechselt wird und wie anspruchsvoll diese Tätigkeiten sind. Ein kurzer Blick auf eine Nachricht kann deshalb weitaus weniger problematisch sein als der ständige Wechsel zwischen mehreren komplexen Aufgaben.",

"Mit der zunehmenden Verbreitung digitaler Medien hat die Frage nach der Aufmerksamkeit eine neue Bedeutung gewonnen. Smartphones und andere Geräte ermöglichen es, jederzeit auf Informationen zuzugreifen und gleichzeitig mit mehreren Personen in Kontakt zu bleiben. Häufig wird daraus geschlossen, dass Menschen dadurch grundsätzlich weniger aufmerksam geworden seien. Eine solche Aussage greift jedoch zu kurz. Digitale Technologien verändern nicht zwangsläufig die Fähigkeit zur Konzentration, sondern schaffen vielmehr eine Umgebung, in der Aufmerksamkeit besonders häufig unterbrochen werden kann. Ob diese Unterbrechungen tatsächlich zu langfristigen Veränderungen führen, lässt sich wissenschaftlich bislang nicht eindeutig beantworten.",

"Interessant ist zudem, dass Aufmerksamkeit nicht ausschließlich von äußeren Reizen bestimmt wird. Auch Erwartungen, persönliche Interessen und emotionale Zustände beeinflussen, worauf ein Mensch seine Aufmerksamkeit richtet. Wer sich beispielsweise große Sorgen um eine bevorstehende Prüfung macht, nimmt möglicherweise Hinweise auf dieses Thema besonders schnell wahr, während andere Informationen in den Hintergrund treten. Aufmerksamkeit ist daher kein rein passiver Vorgang, bei dem das Gehirn einfach auf besonders starke Reize reagiert. Vielmehr wirken äußere Informationen und innere Vorstellungen ständig zusammen und bestimmen gemeinsam, was bewusst wahrgenommen wird.",

"Diese Erkenntnisse sind auch für das Lernen von Bedeutung. Lange Zeit wurde angenommen, dass möglichst lange ununterbrochene Lernphasen grundsätzlich die besten Ergebnisse erzielen. Heute wird stärker berücksichtigt, dass die Qualität der Verarbeitung wichtiger sein kann als die reine Dauer der Beschäftigung mit einem Thema. Pausen können beispielsweise dazu beitragen, geistige Ressourcen wiederherzustellen. Gleichzeitig reicht es nicht aus, lediglich die Arbeitszeit zu unterbrechen. Entscheidend ist, ob Lernende nach einer Pause tatsächlich wieder gezielt auf den Lerngegenstand zurückkehren. Eine Pause kann die Konzentration unterstützen, ersetzt aber keine aktive Auseinandersetzung mit dem Lernstoff.",

"Für die Forschung stellt sich deshalb zunehmend die Frage, wie Aufmerksamkeit gezielt unterstützt werden kann, ohne den Menschen vollständig von störenden Einflüssen abzuschirmen. Eine solche Abschirmung wäre im Alltag kaum realistisch. Vielversprechender erscheint es, Bedingungen zu schaffen, unter denen Menschen selbst besser entscheiden können, wann sie ihre Aufmerksamkeit bündeln und wann sie bewusst zwischen verschiedenen Tätigkeiten wechseln. Dazu gehört auch die Fähigkeit, die eigenen Grenzen zu erkennen. Denn Aufmerksamkeit lässt sich zwar trainieren und teilweise steuern, sie steht dem Menschen jedoch nicht unbegrenzt zur Verfügung. Gerade darin liegt eine der zentralen Herausforderungen einer zunehmend informationsreichen Umwelt."

];

const questions = [

  { stem:"Was wird in Absatz 1 über Aufmerksamkeit gesagt?",
    options:[
      "Sie verarbeitet alle Informationen gleichzeitig.",
      "Sie ist eine begrenzte Ressource.",
      "Sie hängt nur von äußeren Reizen ab.",
      "Sie verhindert Informationsverluste."
    ],
    correct:1 },

  { stem:"Was erschwert laut Absatz 2 die Verarbeitung?",
    options:[
      "Häufige Aufgabenwechsel",
      "Lange Lernphasen",
      "Vorhandenes Wissen",
      "Komplexe Texte"
    ],
    correct:0 },

  { stem:"Welche Überschrift passt zu Absatz 3?",
    options:[
      "Digitale Medien und Konzentration",
      "Smartphones im Berufsleben",
      "Die Folgen moderner Technik",
      "Die Zukunft digitaler Medien"
    ],
    correct:0 },

  { stem:"Wovon wird Aufmerksamkeit laut Absatz 4 beeinflusst?",
    options:[
      "Nur von äußeren Reizen",
      "Von Interessen und Gefühlen",
      "Vor allem von Gewohnheiten",
      "Ausschließlich von Erwartungen"
    ],
    correct:1 },

  { stem:"Was wird über Lernpausen gesagt?",
    options:[
      "Sie ersetzen aktive Lernzeit.",
      "Sie sind immer notwendig.",
      "Sie können die Konzentration unterstützen.",
      "Sie verlängern die Lernzeit."
    ],
    correct:2 },

  { stem:"Was wird im letzten Absatz empfohlen?",
    options:[
      "Ablenkungen vollständig zu vermeiden",
      "Aufmerksamkeit bewusst zu steuern",
      "Digitale Medien einzuschränken",
      "Länger ohne Pause zu arbeiten"
    ],
    correct:1 },

  { stem:"Was ist die Hauptaussage des Textes?",
    options:[
      "Digitale Medien schwächen die Konzentration.",
      "Pausen verbessern grundsätzlich das Lernen.",
      "Aufmerksamkeit ist begrenzt und beeinflussbar.",
      "Menschen können ihre Aufmerksamkeit vollständig kontrollieren."
    ],
    correct:2 }

];
/* ============================================================ */

let userAnswers = new Array(questions.length).fill(null);
let timeLeft = 910;
let timerInterval;
let fontSize = 15;
let markingOn = false;
const letters = ['a','b','c','d'];

function changeFontSize(delta){
  fontSize = Math.min(22, Math.max(11, fontSize + delta));

  document.getElementById('textpanel').style.fontSize = fontSize + 'px';
}

function toggleMarking(){
  markingOn = !markingOn;
  const btn = document.getElementById('markBtn');
  const tp = document.getElementById('textpanel');
  btn.classList.toggle('active', markingOn);
  tp.classList.toggle('marking', markingOn);
}

function handleTextpanelMouseUp(){
  if(!markingOn) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const tp = document.getElementById('textpanel');
  const allowed =
  document.getElementById('textpanel').contains(range.commonAncestorContainer) ||
  document.getElementById('qpanel').contains(range.commonAncestorContainer);

if(!allowed) return;
  if(range.toString().trim() === '') { sel.removeAllRanges(); return; }
  try{
    const mark = document.createElement('mark');
    mark.className = 'hl';
    range.surroundContents(mark);
  }catch(e){
    // selection crosses element boundaries; skip silently
  }
  sel.removeAllRanges();
}


function handleTextpanelClick(e){
  const mark = e.target.closest('mark.hl');
  if(mark){
    const parent = mark.parentNode;
    while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    parent.normalize();
  }
}

function buildExercise(){
  const tp = document.getElementById('textpanel');
  tp.innerHTML = `<h3>${textTitle}</h3>` +
  paragraphs.map((p,i)=>
    `<p class="paragraph-${i}">
      <span class="pnum">(${i+1})</span> ${p}
    </p>`
  ).join('');
  fontSize = 15;
  tp.style.fontSize = fontSize + 'px';
  markingOn = false;
  document.getElementById('markBtn').classList.remove('active');
  tp.classList.remove('marking');
  tp.onmouseup = handleTextpanelMouseUp;
  document.getElementById('qpanel').onmouseup = handleTextpanelMouseUp;
  tp.onclick = handleTextpanelClick;
  
  const qp = document.getElementById('qpanel');
  qp.innerHTML = '';
  userAnswers = new Array(questions.length).fill(null);

  questions.forEach((q, qi)=>{
    const row = document.createElement('div');
    row.className = 'qrow';

    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = `<span><b>Frage ${qi+1}:</b> ${q.stem}</span><span>▾</span>`;
    head.onclick = ()=> toggleBody(qi);

    const body = document.createElement('div');
    body.className = 'qbody';
    body.id = 'qbody-'+qi;

    q.options.forEach((opt, oi)=>{
  const b = document.createElement('div');

  b.className = 'option';

  b.innerHTML =
    `<span class="option-letter">${letters[oi]})</span> ${opt}`;

  b.onclick = ()=> selectOption(qi, oi);

  body.appendChild(b);
});

    row.appendChild(head);
    row.appendChild(body);
    qp.appendChild(row);
  });

  document.getElementById('result').textContent = '';
  startTimer();
}

function toggleBody(qi){

  // Alle anderen Fragen schließen
  document.querySelectorAll('.qbody').forEach((body, i) => {
    if(i !== qi){
      body.classList.remove('open');
    }
  });

  // Nur die angeklickte Frage öffnen
  const body = document.getElementById('qbody-' + qi);
  body.classList.toggle('open');

  // Zum passenden Absatz springen
  const paragraph = document.querySelector(
    '#textpanel .paragraph-' + qi
  );

  if(paragraph){
    paragraph.scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });

    // Absatz hervorheben
    document.querySelectorAll('#textpanel p').forEach(p => {
      p.classList.remove('focus-paragraph');
    });

    paragraph.classList.add('focus-paragraph');
  }
}

function selectOption(qi, oi){
  userAnswers[qi] = oi;
  const body = document.getElementById('qbody-'+qi);
  [...body.children].forEach((btn, i)=>{
    btn.classList.toggle('selected', i===oi);
  });
  const heads = document.querySelectorAll('.qhead');
  heads[qi].classList.add('answered');
}

function saveAT3AndGoToNext(){
  let score = 0;

  questions.forEach((q, qi)=>{
    if(userAnswers[qi] === q.correct){
      score++;
    }
  });

  localStorage.setItem("Lesen_AT3.2", score);

  window.location.href = "Lesen_AT4.2.html";
}

function checkAnswers(){
  clearInterval(timerInterval);
  let score = 0;
  questions.forEach((q, qi)=>{
    const body = document.getElementById('qbody-'+qi);
    [...body.children].forEach((btn, oi)=>{
      btn.classList.remove('selected');
      if(oi === q.correct) btn.classList.add('correct');
      else if(oi === userAnswers[qi]) btn.classList.add('wrong');
    });
    body.classList.add('open');
    if(userAnswers[qi] === q.correct) score++;
  });
  const resultEl = document.getElementById('result');

  resultEl.style.color = score === questions.length ? 'green' : 'var(--accent)';
  resultEl.textContent = `Ergebnis: ${score} von ${questions.length} richtig.`;
}

function resetExercise(){
  clearInterval(timerInterval);
  timeLeft = 910;
  buildExercise();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = 910;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){
      clearInterval(timerInterval);
      checkAnswers();
    }
  },1000);
}

function updateTimerDisplay(){
  const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
  const s = String(timeLeft%60).padStart(2,'0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

buildExercise();
</script>

</body>
</html>
