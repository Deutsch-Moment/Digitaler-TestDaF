<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TestDaF Übung – Reihenfolge</title>
<style>
  :root{
    --primary:#0e6e8c;
    --accent:#c8102e;
    --bg-box:#dde3e8;
  }
  *{box-sizing:border-box; font-family: Arial, Helvetica, sans-serif;}
  body{margin:0; padding:20px; background:#f4f6f7; color:#222;}
  .header{background:var(--primary); color:#fff; padding:14px 20px; font-size:22px; font-weight:bold; border-radius:4px 4px 0 0;}
  .instructions{background:#eaf1f4; padding:16px 20px; font-size:15px; line-height:1.5;}
  .timer{display:inline-block; border:2px solid var(--primary); border-radius:50%; width:70px; height:70px; text-align:center; line-height:70px; font-weight:bold; color:var(--primary); margin-top:10px;}
  .toolbar{display:flex; justify-content:flex-end; gap:8px; padding:10px 20px 0 20px; background:#fff;}
  .toolbtn{width:38px; height:38px; border:1px solid var(--primary); background:#fff; color:var(--primary); border-radius:4px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .toolbtn.small{font-size:12px;}
  .toolbtn.big{font-size:18px;}
  .toolbtn.active{background:var(--primary); color:#fff;}
  .container{display:flex; flex-direction:column; gap:14px; padding:10px 20px 20px 20px; background:#fff;}
  .row{display:flex; align-items:stretch; gap:12px;}
  .num{width:24px; display:flex; align-items:center; justify-content:center; font-weight:bold;}
  .slot{flex:1; min-height:70px; border-radius:4px; display:flex; align-items:center;}
  .slot[data-kind="target"]{background:var(--bg-box); border:2px dashed var(--primary);}
  .slot[data-kind="target"].filled{border-style:solid;}
  .slot[data-kind="home"]{border:2px dashed #bbb; background:#fafafa;}
  .slot.correct{border-color:green !important; background:#e3f7e3 !important;}
  .slot.wrong{border-color:var(--accent) !important; background:#fbe4e7 !important;}
  .textblock{background:#fdfdfd; border:1px solid #bbb; border-radius:4px; padding:12px; font-size:15px; line-height:1.4; cursor:grab; width:100%; margin:2px;}
  .textblock.dragging{opacity:0.4;}
  .textblock mark.hl{background:#fdea63; border-radius:2px;}
  .footer{display:flex; justify-content:flex-end; gap:10px; padding:16px 20px;}
  button.action{background:var(--accent); color:#fff; border:none; padding:10px 20px; border-radius:4px; font-size:15px; cursor:pointer;}
  button.action.secondary{background:#888;}
  #result{padding:0 20px 20px; font-weight:bold;}
</style>
</head>
<body>

<div class="header">LESEN – Aufgabentyp 2: Reihenfolge</div>

<div class="instructions">
  Lesen Sie die Textabschnitte rechts.<br>
  <strong>Bringen Sie die Textabschnitte in die richtige Reihenfolge. Ziehen Sie dafür die Textteile von rechts nach links.</strong><br>
  Es gibt genau eine richtige Reihenfolge.
  <div class="timer" id="timer">05:10</div>
</div>

<div class="toolbar">
  <button class="toolbtn small" onclick="changeFontSize(-1)" title="Verkleinern">A-</button>
  <button class="toolbtn big" onclick="changeFontSize(1)" title="Vergrößern">A+</button>
  <button class="toolbtn" id="markBtn" onclick="toggleMarking()" title="Markieren">✎</button>
</div>

<div class="container" id="container"></div>

<div id="result"></div>

<div class="footer">
  <button class="action secondary" onclick="resetExercise()">
    Zurücksetzen
  </button>

  <button class="action" onclick="checkOrder()">
    Prüfen
  </button>

  <button class="action" onclick="saveAT2AndGoToNext()">Weiter</button>
</button>
</div>

<script>
/* ============================================================
   HIER ANPASSEN: Neue Übung = dieses Array in der RICHTIGEN
   Reihenfolge auflisten (Index 0 = richtige Position 1, usw.)
   ============================================================ */
const textTitle = "Das Rätsel der Quantenkohärenz bei der pflanzlichen Photosynthese";

const textSegments = [

  "Um häufige Aufgabenwechsel einzudämmen, empfiehlt sich eine gebündelte Bearbeitung eingehender Nachrichten. Festgelegte Zeitfenster und deaktivierte Benachrichtigungen können dazu beitragen, konzentrierte Arbeitsphasen vor vermeidbaren Störungen zu schützen.",

  "Auf dieser Grundlage lässt sich der Posteingang systematischer bearbeiten. Während manche Nachrichten unmittelbar beantwortet werden können, sollten andere gezielt zurückgestellt werden. Maßgeblich ist nicht die Anzahl ungelesener E-Mails, sondern die zuverlässige Bearbeitung relevanter Anliegen.",

  "Obwohl E-Mails zum beruflichen Alltag gehören, wird ihr Einfluss auf die Arbeitsorganisation häufig unterschätzt. Neue Nachrichten verleiten dazu, geplante Tätigkeiten zu unterbrechen und die Aufmerksamkeit wiederholt auf andere Inhalte zu richten.",

  "Eine solche Einteilung setzt voraus, dass sie mit den Erwartungen im Team vereinbar ist. Andernfalls entsteht Rechtfertigungsdruck, wenn unterschiedliche Vorstellungen über angemessene Reaktionszeiten aufeinandertreffen. Verbindliche Absprachen sollten daher auch regeln, wie dringende Anliegen übermittelt werden.",

  "Die kurze Bearbeitungsdauer einzelner E-Mails täuscht über ihren tatsächlichen Aufwand hinweg. Denn nach jeder Unterbrechung muss der vorherige Gedankengang rekonstruiert werden. Entscheidend ist somit weniger die einzelne Nachricht als der wiederholte Verlust geistiger Kontinuität."

];
/* ============================================================ */

let slotContents = {}; // slotId -> textIndex (or undefined)
let timeLeft = 310;
let timerInterval;
let fontSize = 15;
let markingOn = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildExercise(){
  const container = document.getElementById('container');
  container.innerHTML = '';
  const shuffledIndices = shuffle(textSegments.map((_,i)=>i));
  slotContents = {};

  textSegments.forEach((_, i)=>{
    const row = document.createElement('div');
    row.className = 'row';

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = (i+1) + '.';

    const target = document.createElement('div');
    target.className = 'slot';
    target.dataset.kind = 'target';
    target.dataset.slot = 'target-' + i;
    target.ondragover = e=>e.preventDefault();
    target.ondrop = e=>onDrop(e, 'target-'+i);

    const home = document.createElement('div');
    home.className = 'slot';
    home.dataset.kind = 'home';
    home.dataset.slot = 'home-' + i;
    home.ondragover = e=>e.preventDefault();
    home.ondrop = e=>onDrop(e, 'home-'+i);

    row.appendChild(num);
    row.appendChild(target);
    row.appendChild(home);
    container.appendChild(row);

    slotContents['home-'+i] = shuffledIndices[i];
  });

  textSegments.forEach((_, i)=>{
    placeCardInSlot(shuffledIndices[i], 'home-'+i);
  });

  fontSize = 15;
  markingOn = false;
  document.getElementById('markBtn').classList.remove('active');
  applyFontSize();

  document.getElementById('result').textContent = '';
  startTimer();
}

function makeCard(textIndex){
  const card = document.createElement('div');
  card.className = 'textblock';
  card.draggable = true;
  card.dataset.textIndex = textIndex;
  card.textContent = textSegments[textIndex];
  card.style.fontSize = fontSize + 'px';
  card.addEventListener('dragstart', e=>{
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', textIndex);
  });
  card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
  card.addEventListener('mouseup', handleMarkSelection);
  return card;
}

function findSlotOf(textIndex){
  for(const key in slotContents){
    if(slotContents[key] === textIndex) return key;
  }
  return null;
}

function placeCardInSlot(textIndex, slotId){
  const slotEl = document.querySelector(`[data-slot="${slotId}"]`);
  if(!slotEl) return;
  slotEl.innerHTML = '';
  slotEl.appendChild(makeCard(textIndex));
  if(slotEl.dataset.kind === 'target') slotEl.classList.add('filled');
}

function clearSlot(slotId){
  const slotEl = document.querySelector(`[data-slot="${slotId}"]`);
  if(!slotEl) return;
  slotEl.innerHTML = '';
  slotEl.classList.remove('filled','correct','wrong');
}

function onDrop(e, targetSlotId){
  e.preventDefault();
  const textIndex = parseInt(e.dataTransfer.getData('text/plain'));
  if(isNaN(textIndex)) return;
  const oldSlotId = findSlotOf(textIndex);
  if(oldSlotId === targetSlotId) return;

  const occupant = slotContents[targetSlotId];

  if(occupant !== undefined){
    slotContents[oldSlotId] = occupant;
    placeCardInSlot(occupant, oldSlotId);
  } else {
    slotContents[oldSlotId] = undefined;
    clearSlot(oldSlotId);
  }

  slotContents[targetSlotId] = textIndex;
  placeCardInSlot(textIndex, targetSlotId);
}

function checkOrder(){

  let score = 0;
  let filledCount = 0;

  const placed = [];

  // Richtige Reihenfolge für Modelltest 6
  // 3 → 5 → 1 → 4 → 2
  const correctOrder = [2, 4, 0, 3, 1];

  // Reihenfolge aus den Zielpositionen lesen
  for(let i = 0; i < textSegments.length; i++){

    const slotId = 'target-' + i;
    const val = slotContents[slotId];

    const el =
      document.querySelector(`[data-slot="${slotId}"]`);

    if(el){
      el.classList.remove('correct','wrong');
    }

    if(val === undefined){
      placed.push(null);
      continue;
    }

    filledCount++;
    placed.push(val);
  }

  const resultEl = document.getElementById('result');

  if(filledCount < textSegments.length){

    resultEl.style.color = '#b8860b';
    resultEl.textContent =
      'Bitte ordnen Sie zuerst alle Textabschnitte zu.';

    return;
  }

  // 5 Textabschnitte = 4 Verbindungen
  for(let i = 0; i < placed.length - 1; i++){

    const current = placed[i];
    const next = placed[i + 1];

    const currentSlot =
      document.querySelector(
        `[data-slot="target-${i}"]`
      );

    if(
      current === correctOrder[i] &&
      next === correctOrder[i + 1]
    ){

      score++;

      if(currentSlot){
        currentSlot.classList.add('correct');
      }

    }else{

      if(currentSlot){
        currentSlot.classList.add('wrong');
      }
    }
  }

  // Bei 4/4 alle 5 Textabschnitte grün
  if(score === 4){

    for(let i = 0; i < textSegments.length; i++){

      const slot =
        document.querySelector(
          `[data-slot="target-${i}"]`
        );

      if(slot){
        slot.classList.remove('wrong');
        slot.classList.add('correct');
      }
    }
  }

  // Bei weniger als 4 Punkten:
  // Der letzte Abschnitt hat keine eigene Verbindung.
  if(score < 4){

    const lastSlot =
      document.querySelector(
        `[data-slot="target-${textSegments.length - 1}"]`
      );

    if(lastSlot){
      lastSlot.classList.remove('correct','wrong');
    }
  }

  resultEl.style.color =
    score === 4 ? 'green' : 'var(--accent)';

  resultEl.textContent =
    `Ergebnis: ${score}/4 Punkte`;
}

function saveAT2AndGoToNext(){

  let score = 0;
  const placed = [];

  // Richtige Reihenfolge für Modelltest 5
  const correctOrder = [2, 4, 0, 3, 1];

  for(let i = 0; i < textSegments.length; i++){
    placed.push(slotContents['target-' + i]);
  }

  // 4 Verbindungen prüfen
  for(let i = 0; i < placed.length - 1; i++){

    if(
      placed[i] === correctOrder[i] &&
      placed[i + 1] === correctOrder[i + 1]
    ){
      score++;
    }
  }

  localStorage.setItem("Lesen_AT2.6", score);

  window.location.href = "Lesen_AT3.6.html";
}

function resetExercise(){
  clearInterval(timerInterval);
  timeLeft = 310;
  buildExercise();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = 310;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){
      clearInterval(timerInterval);
      checkOrder();
    }
  },1000);
}

function updateTimerDisplay(){
  const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
  const s = String(timeLeft%60).padStart(2,'0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

function applyFontSize(){
  document.querySelectorAll('.textblock').forEach(el=> el.style.fontSize = fontSize + 'px');
}

function changeFontSize(delta){
  fontSize = Math.min(22, Math.max(11, fontSize + delta));
  applyFontSize();
}

function toggleMarking(){
  markingOn = !markingOn;
  const btn = document.getElementById('markBtn');
  btn.classList.toggle('active', markingOn);
}

function handleMarkSelection(){
  if(!markingOn) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const card = range.commonAncestorContainer.nodeType === 1
    ? range.commonAncestorContainer.closest?.('.textblock')
    : range.commonAncestorContainer.parentElement?.closest('.textblock');
  if(!card) return;
  if(range.toString().trim() === '') { sel.removeAllRanges(); return; }
  try{
    const mark = document.createElement('mark');
    mark.className = 'hl';
    range.surroundContents(mark);
  }catch(e){}
  sel.removeAllRanges();
}

document.addEventListener('click', function(e){
  const mark = e.target.closest('mark.hl');
  if(mark){
    const parent = mark.parentNode;
    while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    parent.normalize();
  }
});

buildExercise();
</script>

</body>
</html>
